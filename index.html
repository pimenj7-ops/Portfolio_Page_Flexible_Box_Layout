<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GRC 365 Portfolio Page/Flexible Box Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
	@font-face {
		font-family: Georgia;
		src: url("Georgia.ttf");
	} body {
		background: aliceblue;
	} h1 {
		font: 36pt/1.4em Lato;
		text-align: center;
		text-shadow: 2px 3px 6px lightgreen;
		margin-top: 48px;
	} #div1 {
		width: 768px;
		height: 768px;
		border: 24px solid lightgreen;
		background: white;
		margin: 48px auto;
		border-radius: 24px;
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		align-content: flex-start;
	} figure {
		width: 200px;
		height: auto;
		margin: 24px auto;
	} img {
		width: 200px;
		height: auto;
		border: 1px solid gray;
		border-radius: 12px;
	} figcaption {
		font: italic 12pt/1.4em Georgia;
		text-align: center;
	}
</style>
</head>
<body>
		<h1>Selectors</h1>
		<div id="div1">
			<figure>
			<a href="Beautiful Art Sketchbook.jpg">
				<img src="Beautiful Urban Art Sketchbook.jpg" /></a>
			<figcaption>Beautiful Urban Sketchbook by My Modern Art </figcaption>
			</figure>
		</div>
</body>	
</html>
